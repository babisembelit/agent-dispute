[package]
name = "agent-dispute-arbiter"
version = "0.1.0"
edition = "2021"
description = "Off-chain AI arbiter service for the Agent Dispute Protocol"

[dependencies]
solana-client = "~1.18"
solana-sdk = "~1.18"
borsh = "0.10"
solana-account-decoder = "~1.18"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
hex = "0.4"
agent-dispute = { path = "../programs/agent-dispute" }
